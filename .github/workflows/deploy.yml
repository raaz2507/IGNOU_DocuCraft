name: Deploy IGNOU DocuCraft to GitHub Pages

on:
  # जब भी आप main ब्रांच पर पुश करेंगे, यह अपने आप डिप्लॉय होगा
  push:
    branches: ["main"]

  # आप GitHub Actions टैब से इसे कभी भी मैनुअली भी चला सकते हैं
  workflow_dispatch:

# GitHub Pages को डिप्लॉय करने की आवश्यक परमिशन्स
permissions:
  contents: read
  pages: write
  id-token: write

# एक बार में केवल एक ही डिप्लॉयमेंट चले
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact (app folder only)
        uses: actions/upload-pages-artifact@v3
        with:
          # यहाँ केवल app फ़ोल्डर का पाथ दिया गया है
          path: './app'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4