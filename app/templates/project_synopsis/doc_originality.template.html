<template id="tpl-doc-originality">
	<div class="page-viewport-scaler">
		<article class="page-sheet tpl-doc-originality">
			<div class="originality-border-frame">
				<!-- Document Header: Bordered Title Box -->
				<header class="originality-hdr">
					<div class="originality-title-box">
						<h1 class="originality-doc-title">X. &nbsp;&nbsp; CERTIFICATE OF ORIGINALITY</h1>
					</div>
				</header>

				<!-- Main Certificate Body -->
				<main class="originality-body-content">
					<p class="originality-para para-certify">
						This is to certify that the project report titled
						<span class="originality-fill-wrap title-fill-wrap">
							<span class="ink-text val-ProjectTitle"></span>
						</span>
						submitted to <strong>Indira Gandhi National Open University</strong> in partial fulfilment of the requirement
						for the award of the degree of <strong><span class="val-DegreeName">MASTER OF COMPUTER APPLICATIONS</span></strong>, is
						an authentic and original work carried out by Mr. / Ms.
						<span class="originality-fill-wrap name-fill-wrap">
							<span class="ink-text val-Name"></span>
						</span>
						with Enrolment No.
						<span class="originality-fill-wrap enrol-fill-wrap">
							<span class="ink-text val-Enrolment"></span>
						</span>
						under my guidance.
					</p>

					<p class="originality-para para-embodied">
						The matter embodied in this project is genuine work done by the student and has not been
						submitted whether to this University or to any other University / Institute for the fulfilment of the
						requirements of any course of study.
					</p>
				</main>

				<!-- Clean 2-Column Institutional Bottom Section (Option B) -->
				<footer class="originality-footer-columns">
					<!-- Left Column: Student Details -->
					<div class="originality-col student-col">
						<div class="orig-sig-box">
							<div class="orig-sig-img-pad">
								<img src="" alt="Student Signature" class="val-SignatureImg student-sig" style="display:none;" />
							</div>
							<div class="orig-sig-line"></div>
							<div class="orig-sig-label">(Signature of the Student)</div>
						</div>

						<div class="orig-date-row">
							<span class="orig-field-lbl">Date:</span>
							<div class="orig-val-underline date-val-wrap">
								<span class="ink-text val-SubmissionDate"></span>
							</div>
						</div>

						<div class="orig-details-block">
							<div class="orig-block-title">Name and Address<br>Of the student</div>
							<div class="orig-data-line">
								<span class="ink-text val-Name"></span>
							</div>
							<div class="orig-data-line">
								<span class="ink-text val-Address1"></span>
							</div>
							<div class="orig-data-line">
								<span class="ink-text val-Address2"></span>
							</div>
							<div class="orig-data-line">
								<span class="ink-text val-Phone"></span>
							</div>
						</div>

						<div class="orig-enrol-row">
							<span class="orig-field-lbl">Enrolment No.:</span>
							<div class="orig-val-underline enrol-val-wrap">
								<span class="ink-text val-Enrolment"></span>
							</div>
						</div>
					</div>

					<!-- Right Column: Guide Details -->
					<div class="originality-col guide-col">
						<div class="orig-sig-box">
							<div class="orig-sig-img-pad">
								<img src="" alt="Guide Signature" class="val-GuideSignatureImg guide-sig" style="display:none;" />
							</div>
							<div class="orig-sig-line"></div>
							<div class="orig-sig-label">(Signature of the Guide)</div>
						</div>

						<div class="orig-date-row">
							<span class="orig-field-lbl">Date:</span>
							<div class="orig-val-underline date-val-wrap">
								<span class="ink-text val-GuideDate"></span>
							</div>
						</div>

						<div class="orig-details-block">
							<div class="orig-block-title">Name, Designation<br>&amp; Address of the Guide</div>
							<div class="orig-data-line">
								<span class="ink-text val-GuideName"></span>
							</div>
							<div class="orig-data-line">
								<span class="ink-text val-GuideDesignation"></span>
							</div>
							<div class="orig-data-line">
								<span class="ink-text val-GuideAddress1"></span>
							</div>
							<div class="orig-data-line">
								<span class="ink-text val-GuideAddress2"></span>
							</div>
						</div>
					</div>
				</footer>
			</div>
		</article>
	</div>
</template>
