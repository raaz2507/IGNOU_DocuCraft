<template id="tpl-doc-trainee-letter">
	<div class="page-viewport-scaler">
		<article class="page-sheet tpl-doc-trainee-letter">
			<div class="trainee-border-frame">
				<!-- Header Section: Centered IGNOU Emblem & University Info -->
				<header class="trainee-hdr">
					<div class="trainee-emblem-wrap">
						<img src="./assets/IGNOU_logo.svg" alt="IGNOU Emblem" class="trainee-emblem">
					</div>
					<h1 class="trainee-univ-name">INDIRA GANDHI NATIONAL OPEN UNIVERSITY</h1>
					<h2 class="trainee-address">Maidan Garhi, New Delhi – 110068</h2>
					<h3 class="trainee-school val-SchoolName">School of Computer and Information Sciences</h3>
					<div class="trainee-phone">Phone  : 29572902</div>
				</header>

				<!-- Document Title -->
				<div class="trainee-title-wrap">
					<h4 class="trainee-doc-title">Project Trainee Letter (<span class="val-CourseCode">MCSP-232</span>)</h4>
				</div>

				<!-- Date Row (Right-Aligned) -->
				<div class="trainee-date-row">
					<span class="date-lbl">Date:</span>
					<div class="date-dots-wrap">
						<span class="dots-line">_________________</span>
						<span class="ink-text val-SubmissionDate"></span>
					</div>
				</div>

				<!-- Main Certificate Body Paragraph -->
				<main class="trainee-body-content">
					<p class="trainee-para">
						This is to certify that Mr / Ms
						<span class="trainee-fill-wrap name-wrap">
							<span class="dots-line">____________________________________________________</span>
							<span class="ink-text val-Name"></span>
						</span>
						with Enrolment No.
						<span class="trainee-fill-wrap enrol-wrap">
							<span class="dots-line">_________________</span>
							<span class="ink-text val-Enrolment"></span>
						</span>
						is a final year student of the <span class="val-ProgrammeTitle">Master of Computer Applications</span>
						(Programme Code: <span class="val-ProgrammeCode">MCA_NEW</span>), Indira Gandhi National Open University (IGNOU), and
						is required to do a final semester project work in his/her final year starting from January/July session.
					</p>

					<p class="trainee-para">
						Her / His project must be undertaken in a software development Organization/ Industry/Research
						Laboratory under the supervision of a guide, preferably from the same organization with the
						educational qualifications and experience mentioned in the <span class="val-CourseCode">MCSP-232</span> project guidelines. During
						her/his course of study, the student has studied and gained knowledge on various Computer Science
						courses such as Design and Analysis of Algorithms, Object Oriented Analysis and Design, Discrete
						Mathematics, Accountancy and Financial Management, Computer Networks, Software Engineering,
						Data Mining and Data Warehousing, Artificial Intelligence and Machine Learning, Data Science and
						Big Data, Cloud Computing &amp; IoT, Image processing, Mobile Computing. S/he has hands on
						experience in C programming, Internet Technologies, JAVA, Python, R programming etc. S/he may
						please be given a chance to work in your esteemed organization and complete her/his project work. I
						ensure you a sincere and quality output from him. The experience gained by this project work, not only
						benefit the student to partially fulfil the requirements of the <span class="val-ProgrammeTitle">Master of Computer Applications</span> of
						IGNOU, but also lay a foundation for her/his future career.
					</p>

					<p class="trainee-para closing-para">
						Looking forward to your positive response, support and cooperation.
					</p>
				</main>

				<!-- Bottom Authority Signature Block (Right Aligned) -->
				<footer class="trainee-authority-footer">
					<div class="authority-sign-area">
						<div class="authority-stamp-space"></div>
						<div class="authority-title">Signature, Name of the Regional</div>
						<div class="authority-sub">Director/ARD/DD with Date and Stamp</div>
					</div>
				</footer>
			</div>
		</article>
	</div>
</template>
