<template id="tpl-modern">
	<div class="page-viewport-scaler">
		<article class="page-sheet tpl-modern">
			<!-- Header: Official IGNOU Branding & Subtitle -->
			<header class="modern-header">
				<img src="./assets/IGNOU_logo.svg" alt="IGNOU Logo" class="modern-logo">
				<div class="modern-title-group">
					<h1>Indira Gandhi National Open University</h1>
					<p>Assignment Submission Cover Sheet</p>
				</div>
			</header>

			<main class="modern-body">
				<!-- Section 1: Candidate Credentials -->
				<section class="modern-section">
					<div class="modern-sec-heading">1. Candidate Credentials</div>
					<div class="modern-grid-2col">
						<div class="modern-field-cell">
							<span class="modern-cell-label">Enrolment Number</span>
							<span class="ink-text val-Enrolment"></span>
						</div>
						<div class="modern-field-cell">
							<span class="modern-cell-label">Student Name</span>
							<span class="ink-text val-Name"></span>
						</div>
						<div class="modern-field-cell">
							<span class="modern-cell-label">Programme Code</span>
							<span class="ink-text val-ProgrammeCode"></span>
						</div>
						<div class="modern-field-cell">
							<span class="modern-cell-label">Programme Title</span>
							<span class="ink-text val-Programme"></span>
						</div>
						<div class="modern-field-cell">
							<span class="modern-cell-label">Mobile Phone</span>
							<span class="ink-text val-Phone"></span>
						</div>
						<div class="modern-field-cell">
							<span class="modern-cell-label">Email ID</span>
							<span class="ink-text val-Email"></span>
						</div>
						<!-- Single full-width box with 2 rows for Residential Address -->
						<div class="modern-field-cell cell-full cell-2rows">
							<span class="modern-cell-label">Residential Address</span>
							<div class="modern-row-line">
								<span class="ink-text val-Address1"></span>
							</div>
							<div class="modern-row-line">
								<span class="ink-text val-Address2"></span>
							</div>
						</div>
					</div>
				</section>

				<!-- Section 2: Course & Submission Particulars -->
				<section class="modern-section">
					<div class="modern-sec-heading">2. Course &amp; Submission Particulars</div>
					<div class="modern-grid-2col">
						<div class="modern-field-cell">
							<span class="modern-cell-label">Course Code</span>
							<span class="ink-text val-CourseCode"></span>
						</div>
						<div class="modern-field-cell">
							<span class="modern-cell-label">Assignment Number</span>
							<span class="ink-text val-AssignmentNo"></span>
						</div>
						<div class="modern-field-cell cell-full">
							<span class="modern-cell-label">Course Title</span>
							<span class="ink-text val-CourseTitle"></span>
						</div>
						<div class="modern-field-cell">
							<span class="modern-cell-label">Study Centre Code</span>
							<span class="ink-text val-StudyCentreCode"></span>
						</div>
						<div class="modern-field-cell">
							<span class="modern-cell-label">Study Centre Name</span>
							<span class="ink-text val-StudyCentreName"></span>
						</div>
						<div class="modern-field-cell cell-full cell-2rows">
							<span class="modern-cell-label">Study Centre Address</span>
							<div class="modern-row-line">
								<span class="ink-text val-StudyCentreAddress1"></span>
							</div>
							<div class="modern-row-line">
								<span class="ink-text val-StudyCentreAddress2"></span>
							</div>
						</div>
					</div>
				</section>
			</main>

			<!-- Footer: Date & Signature (Strictly 1:1 with Classic) -->
			<footer class="modern-footer">
				<div class="modern-footer-item">
					<span class="modern-sig-label">Date of Submission:</span>
					<div class="modern-sig-line">
						<span class="ink-text val-Date"></span>
					</div>
				</div>
				<div class="modern-footer-item">
					<span class="modern-sig-label">Signature of Student:</span>
					<div class="modern-sig-line">
						<img class="ink-signature-img val-SignatureImg" src="" alt="Signature" style="display:none;">
					</div>
				</div>
			</footer>
		</article>
	</div>
</template>
