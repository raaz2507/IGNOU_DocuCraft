<template id="tpl-portfolio">
	<div class="page-viewport-scaler">
		<article class="page-sheet tpl-portfolio">
			<!-- Left Architectural Accent Bar with Official University Name & Tagline -->
			<div class="portfolio-accent-bar">
				<div class="accent-dots">
					<span></span><span></span><span></span>
				</div>
				<div class="accent-strip-text">
					INDIRA GANDHI NATIONAL OPEN UNIVERSITY • THE PEOPLE'S UNIVERSITY
				</div>
				<div class="accent-dots">
					<span></span><span></span><span></span>
				</div>
			</div>

			<!-- Main Content Area -->
			<div class="portfolio-content-area">
				<!-- Header with Official Logo, University Name & Tagline -->
				<header class="portfolio-header">
					<img src="./assets/IGNOU_logo.svg" alt="IGNOU Logo" class="portfolio-logo">
					<div class="portfolio-header-titles">
						<h1 class="portfolio-univ-title">Indira Gandhi National Open University</h1>
						<p class="portfolio-univ-tagline">The People's University</p>
						<span class="portfolio-sheet-badge">Assignment Submission Cover Sheet</span>
					</div>
				</header>

				<main class="portfolio-body">
					<!-- Card 1: Candidate Credentials & Contact -->
					<section class="portfolio-card">
						<span class="portfolio-card-title">1. Candidate Credentials &amp; Contact</span>
						<div class="portfolio-rows-container">
							<!-- Row 1: Short fields paired -->
							<div class="portfolio-split-row">
								<div class="portfolio-field-item">
									<span class="p-label">Enrolment No.:</span>
									<div class="p-value-wrap"><span class="ink-text val-Enrolment"></span></div>
								</div>
								<div class="portfolio-field-item">
									<span class="p-label">Student Name:</span>
									<div class="p-value-wrap"><span class="ink-text val-Name"></span></div>
								</div>
							</div>

							<!-- Row 2: Short fields paired -->
							<div class="portfolio-split-row">
								<div class="portfolio-field-item">
									<span class="p-label">Programme Code:</span>
									<div class="p-value-wrap"><span class="ink-text val-ProgrammeCode"></span></div>
								</div>
								<div class="portfolio-field-item">
									<span class="p-label">Mobile Phone:</span>
									<div class="p-value-wrap"><span class="ink-text val-Phone"></span></div>
								</div>
							</div>

							<!-- Row 3: Full width for long Programme Title -->
							<div class="portfolio-field-item item-full">
								<span class="p-label">Programme Title:</span>
								<div class="p-value-wrap"><span class="ink-text val-Programme"></span></div>
							</div>

							<!-- Row 4: Full width for Email ID -->
							<div class="portfolio-field-item item-full">
								<span class="p-label">Email ID:</span>
								<div class="p-value-wrap"><span class="ink-text val-Email"></span></div>
							</div>

							<!-- Row 5: Full width 2-row Residential Address -->
							<div class="portfolio-field-item item-full item-2rows">
								<span class="p-label">Residential Address:</span>
								<div class="p-value-stacked">
									<div class="p-row-line"><span class="ink-text val-Address1"></span></div>
									<div class="p-row-line"><span class="ink-text val-Address2"></span></div>
								</div>
							</div>
						</div>
					</section>

					<!-- Card 2: Course & Study Centre Particulars -->
					<section class="portfolio-card">
						<span class="portfolio-card-title">2. Course &amp; Study Centre Particulars</span>
						<div class="portfolio-rows-container">
							<!-- Row 1: Short codes paired -->
							<div class="portfolio-split-row">
								<div class="portfolio-field-item">
									<span class="p-label">Course Code:</span>
									<div class="p-value-wrap"><span class="ink-text val-CourseCode"></span></div>
								</div>
								<div class="portfolio-field-item">
									<span class="p-label">Study Centre Code:</span>
									<div class="p-value-wrap"><span class="ink-text val-StudyCentreCode"></span></div>
								</div>
							</div>

							<!-- Row 2: Full width for Course Title -->
							<div class="portfolio-field-item item-full">
								<span class="p-label">Course Title:</span>
								<div class="p-value-wrap"><span class="ink-text val-CourseTitle"></span></div>
							</div>

							<!-- Row 3: Full width for Assignment Number -->
							<div class="portfolio-field-item item-full">
								<span class="p-label">Assignment Number:</span>
								<div class="p-value-wrap"><span class="ink-text val-AssignmentNo"></span></div>
							</div>

							<!-- Row 4: Full width for Study Centre Name -->
							<div class="portfolio-field-item item-full">
								<span class="p-label">Study Centre Name:</span>
								<div class="p-value-wrap"><span class="ink-text val-StudyCentreName"></span></div>
							</div>

							<!-- Row 5: Full width 2-row Study Centre Address -->
							<div class="portfolio-field-item item-full item-2rows">
								<span class="p-label">Study Centre Address:</span>
								<div class="p-value-stacked">
									<div class="p-row-line"><span class="ink-text val-StudyCentreAddress1"></span></div>
									<div class="p-row-line"><span class="ink-text val-StudyCentreAddress2"></span></div>
								</div>
							</div>
						</div>
					</section>
				</main>

				<!-- Footer: Strictly 1:1 with Classic (Date & Student Signature) -->
				<footer class="portfolio-footer">
					<div class="portfolio-sig-item">
						<span class="p-sig-title">Date of Submission:</span>
						<div class="p-sig-box">
							<span class="ink-text val-Date"></span>
						</div>
					</div>
					<div class="portfolio-sig-item">
						<span class="p-sig-title">Signature of Student:</span>
						<div class="p-sig-box">
							<img class="ink-signature-img val-SignatureImg" src="" alt="Signature" style="display:none;">
						</div>
					</div>
				</footer>
			</div>
		</article>
	</div>
</template>
