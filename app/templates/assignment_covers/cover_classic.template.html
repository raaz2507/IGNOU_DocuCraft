<template id="tpl-classic">
	<div class="page-viewport-scaler">
		<article class="page-sheet tpl-classic">
			<div class="outer-border">
				<div class="inner-border">
					<header class="header-logo-section">
						<img src="./assets/IGNOU_logo.svg" alt="IGNOU Logo">
					</header>
					<main class="form-content">
						<section class="student-profile-section">
							<div class="form-row">
								<span class="form-label">ENROLMENT NO.:</span>
								<div class="line-wrapper">
									<div class="dotted-line"></div>
									<span class="ink-text val-Enrolment"></span>
								</div>
							</div>
							<div class="form-row">
								<span class="form-label">NAME:</span>
								<div class="line-wrapper">
									<div class="dotted-line"></div>
									<span class="ink-text val-Name"></span>
								</div>
							</div>
							<div class="form-row">
								<span class="form-label">ADDRESS:</span>
								<div class="line-wrapper">
									<div class="dotted-line"></div>
									<span class="ink-text val-Address1"></span>
								</div>
							</div>
							<div class="continuation-row">
								<div class="line-wrapper">
									<div class="continuation-dotted-line"></div>
									<span class="ink-text val-Address2"></span>
								</div>
							</div>
						</section>
						<section class="course-details-section">
							<div class="form-row">
								<span class="form-label">PROGRAMME CODE:</span>
								<div class="line-wrapper">
									<div class="dotted-line"></div>
									<span class="ink-text val-ProgrammeCode"></span>
								</div>
							</div>
							<div class="form-row">
								<span class="form-label">PROGRAMME TITLE:</span>
								<div class="line-wrapper">
									<div class="dotted-line"></div>
									<span class="ink-text val-Programme"></span>
								</div>
							</div>
							<div class="form-row">
								<span class="form-label">COURSE CODE:</span>
								<div class="line-wrapper">
									<div class="dotted-line"></div>
									<span class="ink-text val-CourseCode"></span>
								</div>
							</div>
							<div class="form-row">
								<span class="form-label">COURSE TITLE:</span>
								<div class="line-wrapper">
									<div class="dotted-line"></div>
									<span class="ink-text val-CourseTitle"></span>
								</div>
							</div>
							<div class="form-row">
								<span class="form-label">ASSIGNMENT NO.:</span>
								<div class="line-wrapper">
									<div class="dotted-line"></div>
									<span class="ink-text val-AssignmentNo"></span>
								</div>
							</div>
							<div class="form-row">
								<span class="form-label">STUDY CENTRE CODE:</span>
								<div class="line-wrapper">
									<div class="dotted-line"></div>
									<span class="ink-text val-StudyCentreCode"></span>
								</div>
							</div>
							<div class="form-row">
								<span class="form-label">STUDY CENTRE NAME:</span>
								<div class="line-wrapper">
									<div class="dotted-line"></div>
									<span class="ink-text val-StudyCentreName"></span>
								</div>
							</div>
							<div class="form-row">
								<span class="form-label">STUDY CENTRE ADDRESS:</span>
								<div class="line-wrapper">
									<div class="dotted-line"></div>
									<span class="ink-text val-StudyCentreAddress1"></span>
								</div>
							</div>
							<div class="continuation-row">
								<div class="line-wrapper">
									<div class="continuation-dotted-line"></div>
									<span class="ink-text val-StudyCentreAddress2"></span>
								</div>
							</div>
							<div class="form-row">
								<span class="form-label">PHONE NO.:</span>
								<div class="line-wrapper">
									<div class="dotted-line"></div>
									<span class="ink-text val-Phone"></span>
								</div>
							</div>
							<div class="form-row">
								<span class="form-label">EMAIL ID:</span>
								<div class="line-wrapper">
									<div class="dotted-line"></div>
									<span class="ink-text val-Email"></span>
								</div>
							</div>
						</section>
					</main>
					<footer class="footer-section">
						<div class="footer-col-left">
							<span class="form-label">DATE:</span>
							<div class="line-wrapper">
								<div class="dotted-line"></div>
								<span class="ink-text val-Date"></span>
							</div>
						</div>
						<div class="footer-col-right">
							<span class="form-label">SIGNATURE:</span>
							<div class="line-wrapper">
								<div class="dotted-line"></div>
								<img class="ink-signature-img val-SignatureImg" src="" alt="Signature" style="display:none;">
							</div>
						</div>
					</footer>
				</div>
			</div>
		</article>
	</div>
</template>
